name: Test on Multiple OS

on:
  push:
    branches:
      - next
  pull_request:
    branches:
      - next

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest] # Operating systems to test
        node-version: [18, 20, 22]                      # Node.js versions to test
        attempt: [1, 2, 3, 4, 5]                        # Repeat tests 5 times

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      # Linux: Install Python 2
      - name: Set up Python 2 (Ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y python2
          sudo update-alternatives --install /usr/bin/python python /usr/bin/python2 1

      # macOS: Install Python 2 using Homebrew
      - name: Set up Python 2 (macOS only)
        if: runner.os == 'macOS'
        run: |
          brew install python@2 || true
          echo "Setting Python 2 as default"
          echo 'export PATH="/usr/local/bin:$PATH"' >> ~/.bash_profile
          source ~/.bash_profile

      # Windows: Install Python 2 using Chocolatey
      - name: Set up Python 2 (Windows only)
        if: runner.os == 'Windows'
        run: |
          choco install python2 -y
          npm config set python C:\Python27\python.exe

      - name: Install dependencies
        run: |
          npm config set python /usr/bin/python2
          npm install

      - name: Testing on OS (${{ matrix.os }}) with Node.js (version ${{ matrix.node-version }}) attempt ${{ matrix.attempt }}
        run: |
          echo "Run attempt: ${{ matrix.attempt }}"
          npm test

    continue-on-error: false
